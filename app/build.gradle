plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quickmeets.android'
    compileSdk 37

    defaultConfig {
        applicationId 'com.quickmeets.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
